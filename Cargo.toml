[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Hannes Thöne"]
repository = "https://github.com/hthoene/Vanillite"

[workspace.dependencies]
# Internal crates.
vanillite-abi = { path = "crates/vanillite-abi" }
vanillite-base = { path = "crates/vanillite-base" }
vanillite-chunk = { path = "crates/vanillite-chunk" }
vanillite-command = { path = "crates/vanillite-command" }
vanillite-config = { path = "crates/vanillite-config" }
vanillite-data = { path = "crates/vanillite-data" }
vanillite-datapack = { path = "crates/vanillite-datapack" }
vanillite-game = { path = "crates/vanillite-game" }
vanillite-light = { path = "crates/vanillite-light" }
vanillite-macros = { path = "crates/vanillite-macros" }
vanillite-nbt = { path = "crates/vanillite-nbt" }
vanillite-net = { path = "crates/vanillite-net" }
vanillite-plugin = { path = "crates/vanillite-plugin" }
vanillite-plugin-host = { path = "crates/vanillite-plugin-host" }
vanillite-protocol = { path = "crates/vanillite-protocol" }
vanillite-server = { path = "crates/vanillite-server" }
vanillite-storage = { path = "crates/vanillite-storage" }
vanillite-test = { path = "crates/vanillite-test" }
vanillite-world = { path = "crates/vanillite-world" }
vanillite-worldgen = { path = "crates/vanillite-worldgen" }

# External crates.
bumpalo = { version = "3.20", features = ["collections"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
md5 = { package = "md-5", version = "0.10", default-features = false }
rustc-hash = "2.1"
serde_json = "1"
sha1 = "0.10"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# External crates: network (vanillite-nbt, vanillite-protocol, vanillite-macros, vanillite-net).
aes = "0.8"
libdeflater = "1.26"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
rsa = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

# Workspace-wide lints. Input-handling crates (SEC-07) repeat these in their own
# `[lints]` tables and add the SEC-07 deny set, because Cargo cannot extend
# `workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
