[package]
name = "vanillite"
description = "The Vanillite server binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vanillite-config.workspace = true
vanillite-data.workspace = true
vanillite-server.workspace = true
vanillite-storage.workspace = true
ctrlc.workspace = true
log.workspace = true

# musl's allocator is slow with many threads; the static (Docker) build uses mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

