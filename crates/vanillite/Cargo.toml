[package]
name = "vanillite"
description = "The Vanillite server binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
vanillite-config.workspace = true
vanillite-data.workspace = true
vanillite-plugin-host.workspace = true
vanillite-server.workspace = true
vanillite-storage.workspace = true
ctrlc.workspace = true
log.workspace = true
# The console line editor (prompt, history, log lines above the input line).
rustyline = { version = "19", default-features = false }

# musl's allocator is slow with many threads; the static (Docker) build uses mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# vanillite-gnu (the glibc build of the release archives and the Docker image that loads
# plugins): the same allocator as the static build.
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true
