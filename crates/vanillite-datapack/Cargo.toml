[package]
name = "vanillite-datapack"
description = "Data pack loader: dynamic registries, tags, recipes, loot tables, advancements and worldgen settings with a compiled cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["fetch"]
# Download Mojang's server jar on first start. Without it, a local jar must be given.
fetch = ["dep:ureq"]

[dependencies]
vanillite-data.workspace = true
vanillite-nbt.workspace = true
log.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha1.workspace = true
ureq = { workspace = true, optional = true }
zip.workspace = true

[lints]
workspace = true
