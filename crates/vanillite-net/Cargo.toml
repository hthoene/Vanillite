[package]
name = "vanillite-net"
description = "Built-in network pipeline: listener, I/O threads, connection state machine, authentication and rate limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
vanillite-protocol.workspace = true
vanillite-config.workspace = true

# SEC-07: input-handling crate. Cargo cannot extend `[lints] workspace = true`,
# so this repeats the workspace lints and adds the SEC-07 set.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
