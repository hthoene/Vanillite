# Known divergences of the parity scenarios from Vanilla: the first differing tick, why, and
# who fixes it. The check fails when the first difference moves (see `scenario.rs`); raise the
# tick when a fix gets further, remove the entry when the scenario matches.

[light_roofs]
tick = 3
cause = "snow layers that cannot survive break without an entity; the snow loot table needs entity_properties on `this`, which Vanillite's loot (loot.rs) always assumes present, so it drops snowballs where Vanilla drops nothing"
owner = "gameplay-developer"

[mob_creeper_explode]
tick = 112
cause = "explosion drops: Vanillite pops one item per block, Vanilla merges the drops into stacks (addOrAppendStack) and applies the explosion decay; the level random then differs. Also the knocked back mock player: Vanilla moves it on the server, the scenario world does not"
owner = "gameplay-developer #30"

[mob_enderman_teleport]
tick = 1
cause = "the enderman lacks EndermanTakeBlockGoal/EndermanLeaveBlockGoal and the endermite target goal (2 random draws per goal selection in Vanilla); it does not teleport when hurt"
owner = "gameplay-developer #30"

[mob_skeleton_shoot]
tick = 0
cause = "finalizeSpawn draws from the mob's random; Vanilla draws Mob.finalizeSpawn, the equipment, its enchantments and canPickUpLoot from the level random (ServerLevelAccessor.getRandom); arrows take their random from the shooter instead of their own"
owner = "gameplay-developer #30"

[mob_spider_climb]
tick = 1
cause = "the spider lacks the iron golem SpiderTargetGoal (1 random draw per goal selection in Vanilla)"
owner = "gameplay-developer #30"

[mob_zombie_chase]
tick = 1
cause = "the zombie lacks the target goals for villagers, iron golems and turtles and ZombieAttackTurtleEggGoal (4 random draws per goal selection in Vanilla)"
owner = "gameplay-developer #30"
