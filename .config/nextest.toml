# cargo-nextest configuration. Local: `cargo nextest run`. CI: `--profile ci`.

[profile.default]
# Show every failure of a run, not only the first one.
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "fail"
final-status-level = "slow"

[profile.ci]
fail-fast = false
# Flaky tests must be fixed, not hidden by retries.
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Bulk tests marked `#[ignore]` (chunk goldens by seed, large scenario runs) run nightly.
[profile.nightly]
fail-fast = false
retries = 0
slow-timeout = { period = "300s", terminate-after = 6 }
failure-output = "immediate-final"
