# The package description the server reads before it loads the library.
id = "hello"
name = "Hello"
version = "0.1.0"
authors = ["Hannes Thöne"]
website = "https://vanillite.org"
# Plugin API (ABI) version the plugin needs.
api = "1.5"
# Base name of the library: libvanillite_example_hello.so, vanillite_example_hello.dll, ...
library = "vanillite_example_hello"
threading = "serialized"
# Slots the plugin may fill. The generator is off unless generator.enabled is set in config.toml.
provides = ["chunk-generator"]
