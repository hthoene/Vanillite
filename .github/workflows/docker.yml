name: Docker

# Publishes the server image to Docker Hub for releases only: on version tags (v*) and on
# demand. Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; without them the
# job skips. Daily images go to the private registry with `cargo xtask docker --push`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Skip without Docker Hub secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; nothing is published."
      - uses: actions/checkout@v5
        if: env.HAS_SECRETS == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_SECRETS == 'true'
      - uses: docker/login-action@v3
        if: env.HAS_SECRETS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        if: env.HAS_SECRETS == 'true'
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/vanillite
          # Version tags: the version and latest (not for pre-releases). Manual runs: the commit.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: latest=auto
      # The binaries are cross-compiled in the build stage (cargo-zigbuild): no emulation.
      - uses: docker/build-push-action@v6
        if: env.HAS_SECRETS == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
