name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: smaller caches, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only dev writes the cache; branches and PRs read it.
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The tests run in two parallel jobs: the world generation goldens on their own, everything
  # else with the codegen checks and doc tests. Together they run every test of the workspace.
  test:
    name: Tests and codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # The Vanilla data pack the tests extract from the pinned server jar. After rust-cache so
      # that its post step saves before rust-cache cleans target/ (which drops this directory).
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('crates/vanillite-data/src/generated/version.rs') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Generated code is current
        run: cargo xtask codegen --check
      - name: Pterodactyl egg is current
        run: cargo xtask egg --check
      - name: Parity goldens are current
        run: cargo xtask golden check
      - name: Tests (all but world generation)
        run: cargo nextest run --workspace --exclude vanillite-worldgen --all-features --locked --profile ci --no-tests=warn
      - name: Doc tests
        run: cargo test --workspace --all-features --locked --doc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  test-worldgen:
    name: Tests (world generation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: actions/cache@v4
        with:
          path: target/vanilla-cache
          key: vanilla-pack-${{ hashFiles('crates/vanillite-data/src/generated/version.rs') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests
        run: cargo nextest run -p vanillite-worldgen --all-features --locked --profile ci --no-tests=warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit-worldgen
          path: target/nextest/ci/junit.xml

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pinned toolchain (rust-toolchain.toml) from the cache: faster than rustup's download.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.*
            ~/.rustup/update-hashes/1.*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: rustup toolchain install --profile minimal
      # Prebuilt binary instead of the action's container build; same command as the action's
      # defaults.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --log-level warn --all-features check
